    <script>
      // Runs before paint: apply saved theme and enable reveal animations without a flash.
      (function () {
        var html = document.documentElement;
        html.classList.add('js');
        try {
          var saved = localStorage.getItem('sc-theme');
          if (saved === 'light' || saved === 'dark') html.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
